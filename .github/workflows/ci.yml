name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Qt needs no display: widgets are built and driven headlessly.
  QT_QPA_PLATFORM: offscreen

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Style and types depend on neither the platform nor the interpreter, so they run once
  # rather than in every cell of the test matrix.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        # Every supported interpreter on Linux, and the current one on each of the other
        # two platforms: what varies with the Python version is the language, what varies
        # with the operating system is the filesystem, the path separators and where Qt
        # keeps its settings. Testing all three everywhere would buy nothing.
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-14, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }}, py${{ matrix.python }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --python is what makes the matrix mean anything: without it uv resolves against
      # whichever interpreter the runner happens to ship, and the three Linux cells all
      # test the same one.
      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python }}

      - name: Test
        run: uv run pytest

  # The package imports itself by absolute name, which PyInstaller resolves through the
  # spec's hiddenimports. Built on every platform the spec branches on -- the macOS bundle,
  # the UPX setting and the icon differ -- so a broken spec is caught here and not at the
  # moment a release is tagged.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra build

      - name: Build standalone bundle
        run: uv run python scripts/build.py
