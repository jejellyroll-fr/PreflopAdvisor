[TreeReader]
Fold=0
Call=1
Raise100=40100
RaisePot=2
All_In=3
Raise60=40060
Raise70=40070
Raise75=40075
3xOpen=15
Ending=.rng
# Shortest stack first; the reader trims this to the tree's player count and reverses it
# into acting order. A tree declaring more players than there are names here is cut down
# to the names that exist, so a table size needing another seat needs another name.
Positions=BB,SB,BU,CO,MP,UTG
# Which seats a table of that size has, when trimming the list above would name them
# wrongly. Six-handed the earliest seat is UTG; seven-handed there is a hijack between it
# and the cutoff, and trimming a single list can only ever get one of the two right. Each
# size adds its seat where the table adds it, not at the end.
#   7-max  UTG MP HJ CO BU SB BB
#   8-max  UTG MP LJ HJ CO BU SB BB
#   9-max  UTG UTG1 MP LJ HJ CO BU SB BB
# Rename these to match your own exports if your solver labels the middle seats
# differently; nothing but the display depends on the names.
Positions7=BB,SB,BU,CO,HJ,MP,UTG
Positions8=BB,SB,BU,CO,HJ,LJ,MP,UTG
Positions9=BB,SB,BU,CO,HJ,LJ,MP,UTG1,UTG
# if you have different sizings than pot in your tree you have to add description you want to show
# into this list and also add an entry "description" = "number used by monker export"
# you have to figure it out by yourself / check the filenames in ranges folder ->
# open it and compare one hand's ev with monker ev to see if you make the correct assumption
RaiseSizeList=Raise75, RaisePot, Raise100, All_In
ValidActions=Fold, Call, Raise
# raise is then substituted with valide raise size ala Raise100, Raise60, AllIn etc
CacheSize=100
#RAM inefficient - just use 0 if unsure - its only a speedup for plo5card lookups since they take 1-3secs
# means number of files use at least 200
# i use 1000 but this uses up to 10GB of RAM
# Read hands from a preflop.db built next to the range files instead of scanning them.
# Indexed lookups, no range file held in RAM, so CacheSize stops mattering. The database
# is built on first use (once per tree, minutes for a large export) and rebuilt whenever
# the range files change. The files are kept either way. Set to yes to enable.
UseDatabase=no


[PositionSelector]
PositionList = X,UTG,UTG1,MP,LJ,HJ,CO,BU,SB,BB
# Seats disabled regardless of table size. Leave empty: which seats exist is derived
# from the selected tree's player count, and listing SB here made it unselectable even
# heads-up, where it is one of only two seats.
PositionInactive =
ButtonHeight = 30
ButtonWidth = 40
ButtonPad = 10
FontSize = 14
Font = Helvetica
DefaultPosition = 0

[Output]
FontSize=10
Font=Helventica
# Show EVs relative to folding rather than in absolute terms.
AdjustFoldEV=yes
# Monker exports EVs in chips with the big blind worth 2000. Only change this if your
# tree was exported under a different convention.
ChipsPerBB=2000

