; Minimal configuration used by the module-level demo entry points.
; The authoritative application configuration is preflop_advisor/config.ini.
;
; Each RaiseSizeList entry is the *name* of a key defined in this section; that key
; holds the Monker code used in range file names. Sizings are probed in the order
; listed, and the first one that exists in the tree is used.
[TreeReader]
# Action codes of the .tree format, as MonkerSolver itself decodes them into an amount.
# Two general forms cover any size:
#   40000 + p  ->  p percent of the pot   (40075 = 75%)
#   11 + k     ->  k half blinds          (15 = 2 BB, so a 3 BB open)
# In both the amount is added ON TOP of the call, not to the total.
# Note that 9 and 40075 are both three quarters of the pot but are written differently:
# the interface's "3/4 pot" button produces 9.rng, not 40075.rng.
Fold=0
Call=1
RaisePot=2
All_In=3
Raise75=40075
Raise100=40100
MinRaise=5
Raise1BB=6
Raise25Pot=7
Raise200Pot=8
Raise75Pot=9
Ending=.rng
Positions=BB,SB,BU,CO,MP,UTG
RaiseSizeList=Raise75, RaisePot, Raise100, All_In
ValidActions=Fold, Call, Raise
CacheSize=100
