; Minimal configuration used by the module-level demo entry points.
; The authoritative application configuration is preflop_advisor/config.ini.
;
; Each RaiseSizeList entry is the *name* of a key defined in this section; that key
; holds the Monker code used in range file names. Sizings are probed in the order
; listed, and the first one that exists in the tree is used.
[TreeReader]
Fold=0
Call=1
RaisePot=2
All_In=3
Raise75=40075
Raise100=40100
Ending=.rng
Positions=BB,SB,BU,CO,MP,UTG
RaiseSizeList=Raise75, RaisePot, Raise100, All_In
ValidActions=Fold, Call, Raise
CacheSize=100
