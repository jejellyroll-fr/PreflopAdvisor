[build-system]
# Required for the project to be installed into the environment. Without it uv treats
# this as a virtual project, the [project.scripts] console script is never created, and
# `uv run preflop_advisor` falls back to executing the preflop_advisor/ directory --
# which runs __main__.py with no parent package, breaking its relative imports.
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preflop_advisor"
version = "0.2"
requires-python = ">=3.10"
dependencies = ["pyside6>=6.8.0.2"]

[project.scripts]
preflop_advisor = "preflop_advisor.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8.3.2", "pytest-qt>=4.0.2", "pytest-cov>=5.0.0"]
dev = ["pytest>=8.3.2", "pytest-qt>=4.0.2", "pytest-cov>=5.0.0", "ruff>=0.6.0", "mypy>=1.11"]
build = ["pyinstaller>=6.9.0", "wheel>=0.40.0"]
build-linux = ["python-appimage==1.2.7"]
windows = ["pywin32==306", "configparser"]
linux = ["xcffib==1.5.0"]
macos = ["pyobjc==10.3.1"]
mysql = ["mysqlclient==2.2.4"]
postgresql = ["psycopg2-binary==2.9.9"]

[tool.ruff]
extend-include = ["*.pyw"]
extend-exclude = ["build", "archives"]
# Lines configuration
line-length = 120
indent-width = 4

[tool.ruff.format]
exclude = ["*.ipynb"]

[tool.ruff.lint]
exclude = ["*.ipynb"]
ignore = [
    "E401", # Multiple imports on one line"
    "E731", # Do not assign a `lambda` expression, use a `def`
    "E713", # Test for membership should be `not in`
    "LOG015", # Root logger usage
    "EXE001", # Shebangs are kept as documentation; modules are run via -m, not directly
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
# `ranges` is 15MB of demonstration trees. Users export their own from Monker and point
# [TreeInfos] at them, so shipping it in the wheel would be dead weight; a wheel install
# reports the missing folder in the status bar until a tree is configured.
exclude = ["pics", "ranges", "tests", "tests.*"]

[tool.setuptools.package-data]
# Declared explicitly rather than relying on include-package-data: config.ini is loaded
# unconditionally at startup, and the tooltip overviews are looked up under popup-pics/.
preflop_advisor = ["config.ini", "popup-pics/*"]

[tool.mypy]
# Strict: every function annotated, no implicit Any, no calls into untyped code. The
# application code and the scripts are covered; the suite is not, since a test's types are
# whatever the fixtures hand it.
python_version = "3.10"
strict = true
files = ["preflop_advisor", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --cov-fail-under=90"
markers = [
    "slow: spawns a subprocess or otherwise takes seconds (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["preflop_advisor"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    # Module-level demo entry points kept for manual inspection; they instantiate a
    # QApplication and block, so they are not exercised by the suite.
    "^def test\\(\\):",
    "^def main\\(\\):",
]
